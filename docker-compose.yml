version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogapp_php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-blogapp}
      DB_USERNAME: ${DB_USERNAME:-blog_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_db_pass}
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public
    networks:
      - blog_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: blogapp_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - blog_network
    depends_on:
      - app

  db:
    image: mariadb:10.6
    container_name: blogapp_db
    restart: unless-stopped
    # Optimizaciones de memoria criticas para VPS de 512MB/1GB
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--innodb-buffer-pool-size=64M',
      '--max-connections=20',
      '--key-buffer-size=16M'
    ]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-blogapp}
      MYSQL_USER: ${DB_USERNAME:-blog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_db_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - blog_network

networks:
  blog_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
